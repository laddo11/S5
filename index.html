
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>I Love You Swarna ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    width: 100%;
    height: 100vh;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

.container {
    width: 100%;
    height: 100%;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(
        ellipse at center,
        #21091b 0%,
        #080008 55%,
        #000 100%
    );
}

canvas {
    width: 100%;
    height: 100%;
    display: block;
}

.caption {
    position: absolute;
    bottom: 9%;
    width: 100%;
    text-align: center;
    color: #ff8acb;
    font-size: clamp(20px, 5vw, 30px);
    font-weight: bold;
    letter-spacing: 2px;
    text-shadow:
        0 0 8px #ff1493,
        0 0 18px #ff1493,
        0 0 35px #ff69b4;
    animation: pulse 2s ease-in-out infinite alternate;
}

@keyframes pulse {
    from {
        transform: scale(1);
        opacity: .7;
    }
    to {
        transform: scale(1.08);
        opacity: 1;
    }
}
</style>
</head>

<body>

<div class="container">
    <canvas id="canvas"></canvas>
    <div class="caption">I Love You Swarna ❤️</div>
</div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const phrase = "I Love You Swarna";

let W, H, scale;
let particles = [];
let time = 0;

function resize() {

    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W * dpr;
    canvas.height = H * dpr;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    scale = Math.min(W / 38, H / 35);

    createParticles();
}

function heartPoint(t, s) {

    const x = 16 * Math.pow(Math.sin(t), 3);

    const y = -(
        13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t)
    );

    return {
        x: x * s,
        y: y * s
    };
}

function createParticles() {

    particles = [];

    // Outer heart rings
    for (let ring = 0; ring < 7; ring++) {

        const factor = 1 - ring * 0.055;
        const count = 90 + ring * 12;

        for (let i = 0; i < count; i++) {

            const t = (i / count) * Math.PI * 2;

            particles.push({
                t: t,
                factor: factor,
                ring: ring,
                speed: 0.20 + Math.random() * 0.12,
                phase: Math.random() * Math.PI * 2,
                size: 9 + Math.random() * 3
            });
        }
    }
}

function drawBackground() {

    // Small glowing stars
    for (let i = 0; i < 45; i++) {

        const x = (i * 137.5) % W;
        const y = (i * 97.3) % H;

        const alpha = 0.15 +
            Math.abs(Math.sin(time * 2 + i)) * 0.5;

        ctx.beginPath();
        ctx.arc(x, y, 1.2, 0, Math.PI * 2);

        ctx.fillStyle = `rgba(255,120,190,${alpha})`;
        ctx.fill();
    }
}

function animate() {

    requestAnimationFrame(animate);

    time += 0.012;

    ctx.clearRect(0, 0, W, H);

    drawBackground();

    const cx = W / 2;
    const cy = H / 2 - 15;

    // Heart breathing effect
    const breathing = 1 + Math.sin(time * 2) * 0.018;

    particles.forEach((p, index) => {

        const movement = time * p.speed;

        const t = p.t + movement;

        const s = scale * p.factor * breathing;

        const point = heartPoint(t, s);

        const next = heartPoint(t + 0.003, s);

        const angle = Math.atan2(
            next.y - point.y,
            next.x - point.x
        );

        const wave = Math.sin(
            time * 2.5 + p.phase
        ) * 2;

        const x = cx + point.x + wave;
        const y = cy + point.y +
            Math.cos(time * 2 + p.phase) * 2;

        ctx.save();

        ctx.translate(x, y);
        ctx.rotate(angle);

        ctx.font = `bold ${p.size}px Arial`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        const alpha = 0.65 +
            Math.sin(time * 2 + p.phase) * 0.3;

        ctx.globalAlpha = alpha;

        // Pink neon glow
        ctx.shadowColor = "#ff1493";
        ctx.shadowBlur = 15;

        ctx.fillStyle = "#ff75bb";

        ctx.fillText(phrase, 0, 0);

        // Bright glowing layer
        ctx.shadowBlur = 25;
        ctx.fillStyle = "#ffd0e8";

        ctx.globalAlpha = 0.25;
        ctx.fillText(phrase, 0, 0);

        ctx.restore();
    });
}

window.addEventListener("resize", resize);

resize();
animate();

</script>

</body>
</html>
