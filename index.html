
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Love You Swarna ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #000;
    width: 100%;
    height: 100vh;
    overflow: hidden;
}

.container {
    width: 100%;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
}

canvas {
    width: 100%;
    height: 100%;
    display: block;
}
</style>
</head>

<body>

<div class="container">
    <canvas id="heart"></canvas>
</div>

<script>
const canvas = document.getElementById("heart");
const ctx = canvas.getContext("2d");

const TEXT = "I Love You Swarna";

let W, H, DPR, scale;
let time = 0;

function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W * DPR;
    canvas.height = H * DPR;

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    scale = Math.min(W / 37, H / 34);
}

function heart(t, s) {
    return {
        x: 16 * Math.pow(Math.sin(t), 3) * s,
        y: -(
            13 * Math.cos(t)
            - 5 * Math.cos(2*t)
            - 2 * Math.cos(3*t)
            - Math.cos(4*t)
        ) * s
    };
}

function distance(a, b) {
    return Math.hypot(b.x-a.x, b.y-a.y);
}

// Calculate heart curve length
function getLength(s) {
    let length = 0;
    let previous = heart(0, s);

    for (let i = 1; i <= 1000; i++) {
        const current = heart(
            i / 1000 * Math.PI * 2, s
        );

        length += distance(previous, current);
        previous = current;
    }

    return length;
}

function drawTextRing(cx, cy, ring, animationTime) {

    const factor = 1 - ring * 0.055;
    const s = scale * factor;

    const circumference = getLength(s);

    ctx.font = "bold 10px Arial";

    const textWidth = ctx.measureText(TEXT).width;

    const spacing = textWidth * 0.94;

    const count = Math.ceil(circumference / spacing);

    const phase = animationTime *
        (ring % 2 === 0 ? 0.18 : -0.18);

    for (let i = 0; i < count; i++) {

        const progress =
            (i / count + phase) % 1;

        const t = progress * Math.PI * 2;

        const p = heart(t, s);

        const next = heart(t + 0.001, s);

        const angle = Math.atan2(
            next.y - p.y,
            next.x - p.x
        );

        const sway = Math.sin(
            animationTime * 2 + i * 0.2 + ring
        ) * 1.5;

        ctx.save();

        ctx.translate(
            cx + p.x + sway,
            cy + p.y
        );

        ctx.rotate(angle);

        ctx.font = "bold 10px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        // Pink neon glow
        ctx.shadowColor = "#ff55ad";
        ctx.shadowBlur = 12;

        ctx.fillStyle = "#ff80c0";
        ctx.globalAlpha = 0.85;

        ctx.fillText(TEXT, 0, 0);

        // Bright neon layer
        ctx.shadowBlur = 19;
        ctx.fillStyle = "#ffc0e0";

        ctx.globalAlpha = 0.25;

        ctx.fillText(TEXT, 0, 0);

        ctx.restore();
    }
}

function animate() {

    requestAnimationFrame(animate);

    time += 0.012;

    ctx.clearRect(0, 0, W, H);

    const cx = W / 2;
    const cy = H / 2;

    // Gentle heart movement
    const breathing =
        1 + Math.sin(time * 1.5) * 0.012;

    ctx.save();

    ctx.translate(cx, cy);
    ctx.scale(breathing, breathing);
    ctx.translate(-cx, -cy);

    // Multiple parallel text layers
    for (let ring = 0; ring < 7; ring++) {
        drawTextRing(cx, cy, ring, time);
    }

    ctx.restore();
}

window.addEventListener("resize", resize);

resize();
animate();

</script>

</body>
</html>
