<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Love You Sona ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #000;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

.container {
    width: 100%;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    background: radial-gradient(circle, #180817, #000 75%);
}

canvas {
    width: 100%;
    height: 100%;
    display: block;
}

.message {
    position: absolute;
    bottom: 12%;
    color: #ff8acb;
    font-size: clamp(18px, 4vw, 28px);
    text-align: center;
    letter-spacing: 2px;
    text-shadow: 0 0 10px #ff1493,
                 0 0 25px #ff1493;
    animation: glow 2s infinite alternate;
}

@keyframes glow {
    from {
        opacity: 0.65;
        transform: scale(1);
    }
    to {
        opacity: 1;
        transform: scale(1.08);
    }
}
</style>
</head>

<body>

<div class="container">
    <canvas id="heart"></canvas>
    <div class="message">I Love You Sona ❤️</div>
</div>

<script>
const canvas = document.getElementById("heart");
const ctx = canvas.getContext("2d");

let width, height;
let particles = [];

const text = "I Love You Sona";

function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    createHeart();
}

function heartPoint(t, scale) {
    const x = 16 * Math.pow(Math.sin(t), 3);

    const y = -(13 * Math.cos(t)
        - 5 * Math.cos(2*t)
        - 2 * Math.cos(3*t)
        - Math.cos(4*t));

    return {
        x: width / 2 + x * scale,
        y: height / 2 + y * scale
    };
}

function createHeart() {
    particles = [];

    const scale = Math.min(width / 42, height / 35);

    const total = 230;

    for (let i = 0; i < total; i++) {
        const t = (i / total) * Math.PI * 2;

        const p = heartPoint(t, scale);

        particles.push({
            x: p.x,
            y: p.y,
            t: t,
            scale: scale,
            offset: Math.random() * 100,
            speed: 0.5 + Math.random() * 1.5,
            size: 11 + Math.random() * 4,
            phase: Math.random() * Math.PI * 2
        });
    }

    // Additional inner heart text
    for (let i = 0; i < 65; i++) {
        const t = Math.random() * Math.PI * 2;
        const r = Math.random() * 0.65;

        const p = heartPoint(t, scale * r);

        particles.push({
            x: p.x,
            y: p.y,
            t: t,
            scale: scale * r,
            offset: Math.random() * 100,
            speed: 0.4 + Math.random(),
            size: 11,
            phase: Math.random() * Math.PI * 2
        });
    }
}

let time = 0;

function animate() {
    ctx.clearRect(0, 0, width, height);

    time += 0.016;

    particles.forEach((p, i) => {

        const movement = Math.sin(
            time * p.speed + p.phase
        ) * 5;

        const drift = Math.sin(
            time * 1.3 + p.offset
        ) * 3;

        let x = p.x + movement;
        let y = p.y + drift;

        ctx.save();

        ctx.translate(x, y);

        // Follow heart curve direction
        const tangent = 0.01;

        const next = heartPoint(
            p.t + tangent,
            p.scale
        );

        const current = heartPoint(
            p.t,
            p.scale
        );

        const angle = Math.atan2(
            next.y - current.y,
            next.x - current.x
        );

        ctx.rotate(angle);

        const alpha = 0.65 +
            Math.sin(time * 2 + p.phase) * 0.3;

        ctx.globalAlpha = alpha;

        ctx.font = `bold ${p.size}px Arial`;

        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        // Neon glow
        ctx.shadowColor = "#ff1493";
        ctx.shadowBlur = 15;

        ctx.fillStyle = "#ff85c8";

        ctx.fillText(text, 0, 0);

        // Extra bright glow
        ctx.shadowBlur = 25;
        ctx.fillStyle = "#ffc0e2";

        ctx.globalAlpha = 0.3;
        ctx.fillText(text, 0, 0);

        ctx.restore();
    });

    requestAnimationFrame(animate);
}

window.addEventListener("resize", resize);

resize();
animate();

</script>

</body>
</html>
